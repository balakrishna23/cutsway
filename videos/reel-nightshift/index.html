<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #07070a;
      }
    </style>
  </head>
  <body>
    <!-- Cutsway reel v2, Night Shift: 30 s on a 128 BPM grid (beat 0.46875 s, bar 1.875 s).
         Look: MOTION.md. Shots: SPEC.md. Music: ../tools/make_music.py nightshift. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="send"
        data-composition-id="send"
        data-composition-src="compositions/send.html"
        data-start="0"
        data-duration="3.75"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="night"
        data-composition-id="night"
        data-composition-src="compositions/night.html"
        data-start="3.75"
        data-duration="13.5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="morning"
        data-composition-id="morning"
        data-composition-src="compositions/morning.html"
        data-start="16.875"
        data-duration="3.75"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="post"

        data-start="20.625"

        data-height="1920"

        data-width="1080"
        data-height="1920"

        data-track-index="6"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
