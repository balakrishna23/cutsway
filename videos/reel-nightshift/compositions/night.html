  <div id="root" data-composition-id="night" data-width="1080" data-height="1920">

    <h2 id="night-sleep" class="night-copy clip" data-start="0" data-duration="6.5" data-track-index="2">

    <h2 id="night-cut" class="night-copy clip" data-start="6.5" data-duration="6.625" data-track-index="3">

    <!-- On the desk tonight: one card per service, seven beats each. -->
    <div id="night-k1" class="night-card clip" data-start="0" data-duration="3.28125" data-track-index="5">

  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(900021);
      const B = 60 / 128;
      // One hour every two beats: 9 PM to 9 AM in 11.25 s, then 9 AM holds.
      const STEP = 2 * B;
      const CARD = 7 * B;
      const HOURS = ["9:00 PM", "10:00 PM", "11:00 PM", "12:00 AM", "1:00 AM", "2:00 AM", "3:00 AM",
        "4:00 AM", "5:00 AM", "6:00 AM", "7:00 AM", "8:00 AM", "9:00 AM"];

      // Static decoration: stars and the skyline with its lit windows.
      const stars = document.getElementById("night-stars");
      for (let i = 0; i < 60; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", (rnd() * 872).toFixed(1));
        c.setAttribute("cy", (rnd() * 220).toFixed(1));
        c.setAttribute("r", (0.8 + rnd() * 1.6).toFixed(1));
        c.setAttribute("fill", "#f4f2ec");
        c.setAttribute("opacity", (0.3 + rnd() * 0.6).toFixed(2));
        stars.appendChild(c);
      }
      const city = document.getElementById("night-city");
      const lights = [];
      let x = 0;
      while (x < 872) {
        const w = 50 + rnd() * 80;
        const h = 90 + rnd() * 150;
        const b = document.createElementNS(NS, "rect");
        b.setAttribute("x", x.toFixed(1));
        b.setAttribute("y", (412 - h).toFixed(1));
        b.setAttribute("width", (w + 1).toFixed(1));
        b.setAttribute("height", h.toFixed(1));
        b.setAttribute("fill", "#0b0b10");
        city.appendChild(b);
        for (let wy = 412 - h + 14; wy < 400; wy += 22) {
          for (let wx = x + 10; wx < x + w - 14; wx += 19) {
            if (rnd() < 0.42) {
              const l = document.createElementNS(NS, "rect");
              l.setAttribute("x", wx.toFixed(1));
              l.setAttribute("y", wy.toFixed(1));
              l.setAttribute("width", "8");
              l.setAttribute("height", "11");
              l.setAttribute("fill", "#fcb51c");
              city.appendChild(l);
              lights.push({ el: l, off: 0.8 + rnd() * 9.6, keep: rnd() < 0.12 });
            }
          }
        }
        x += w + 6 + rnd() * 10;
      }

      const tl = gsap.timeline({ paused: true });
      // Beat punch: a quick scale hit that settles, placed on the beat grid.
      function punch(targets, times, amount, dur) {
        times.forEach((at) => {
          tl.fromTo(targets, { scale: 1 + amount }, { scale: 1, duration: dur || 0.22, ease: "power2.out", immediateRender: false }, at);
        });
      }
      // Shooting stars across the night sky.
      [["#night-star1", 1.9], ["#night-star2", 4.6], ["#night-star3", 7.4]].forEach(([id, at]) => {
        tl.fromTo(id, { x: 0, y: 0, rotation: 18, opacity: 0 }, { x: 420, y: 140, opacity: 1, duration: 0.18, ease: "power2.in" }, at);
        tl.to(id, { opacity: 0, duration: 0.14, ease: "power2.out" }, at + 0.18);
      });
      punch(["#night-s1", "#night-s2", "#night-s3"], [2, 4, 6, 8, 10].map((k) => k * B + 0.1), 0.04);
      punch(["#night-c1", "#night-c2"], [6.5625 + 2 * B, 6.5625 + 4 * B, 6.5625 + 6 * B], 0.06);

      // The sky: dusk, then midnight, then dawn.
      tl.fromTo("#night-mid", { opacity: 0 }, { opacity: 1, duration: 1.5, ease: "power2.inOut" }, 0.3);
      tl.fromTo("#night-stars", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 0.8);
      tl.to("#night-stars", { opacity: 0, duration: 1.2, ease: "power2.inOut" }, 8.8);
      tl.fromTo("#night-dawn", { opacity: 0 }, { opacity: 1, duration: 2.4, ease: "power2.inOut" }, 8.6);
      tl.fromTo("#night-sun", { y: 0 }, { y: -320, duration: 3.0, ease: "power2.out" }, 9.0);
      lights.forEach((l) => {
        if (!l.keep) tl.fromTo(l.el, { opacity: 1 }, { opacity: 0.1, duration: 0.08, ease: "none" }, l.off);
      });

      // The copy in the sky.
      tl.fromTo(
        ["#night-s1", "#night-s2", "#night-s3"],
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.067 },
        0.1,
      );
      tl.to(["#night-s1", "#night-s2", "#night-s3"], { opacity: 0, filter: "blur(8px)", duration: 0.13, ease: "power3.in", stagger: 0.02 }, 6.35);
      tl.fromTo(
        ["#night-c1", "#night-c2"],
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.08 },
        6.5625,
      );
      tl.to(["#night-c1", "#night-c2"], { opacity: 0, filter: "blur(8px)", duration: 0.13, ease: "power3.in" }, 12.95);

      // The desk: each card rises in on its downbeat, fills its bar, and leaves upward.
      for (let k = 1; k <= 4; k++) {
        const t0 = (k - 1) * CARD;
        tl.fromTo(`#night-k${k}-in`, { y: 160, opacity: 0, filter: "blur(12px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, t0);
        tl.fromTo(`#night-k${k}-num`, { scale: 1.35, opacity: 0, transformOrigin: "right center" }, { scale: 1, opacity: 1, duration: 0.22, ease: "expo.out" }, t0 + B);
        tl.fromTo(`#night-k${k}-fill`, { scaleX: 0 }, { scaleX: 1, duration: CARD - 0.4, ease: "none" }, t0 + 0.15);
        punch(`#night-k${k}-num`, [t0 + 3 * B, t0 + 5 * B], 0.12, 0.2);
        punch(`#night-k${k}-in`, [t0 + 4 * B], 0.02, 0.25);
        tl.to(`#night-k${k}-in`, { y: -80, opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, t0 + CARD - 0.18);
      }

      // The clock, a quick roll on every step.
      const a = document.getElementById("night-time-a");
      const b = document.getElementById("night-time-b");
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: 13.5, duration: 13.5, ease: "none" }, 0);
      function paint() {
        const t = clock.t;
        const k = Math.min(12, Math.floor(t / STEP));
        const f = Math.min(1, (t - k * STEP) / 0.1);
        const e = 1 - Math.pow(1 - f, 3);
        const hit = 1 + 0.08 * Math.exp(-(t - k * STEP) / 0.12);
        a.textContent = HOURS[k];
        a.style.color = k === 12 ? "#fddf4b" : "#f4f2ec";
        if (k > 0 && k <= 12 && t - k * STEP < 0.1) {
          b.textContent = HOURS[k - 1];
          a.style.transform = `translateY(${(1 - e) * 110}px) scale(${hit})`;
          b.style.transform = `translateY(${-e * 110}px)`;
          b.style.opacity = String(1 - e);
          a.style.opacity = String(e);
        } else {
          a.style.transform = `translateY(0px) scale(${k > 0 ? hit : 1})`;
          a.style.opacity = "1";
          b.style.opacity = "0";
        }
      }
      tl.eventCallback("onUpdate", paint);
      paint();
      window.__timelines["night"] = tl;
    })();
  </script>
