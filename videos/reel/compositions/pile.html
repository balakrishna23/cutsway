<template>
  <style>
    @font-face {
      font-family: "Archivo";
      src: url("assets/fonts/archivo-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-stretch: 62% 125%;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #07070a;
    }
    #pile-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(520px 420px at 12% 104%, rgb(28 76 221 / 0.34), transparent 70%),
        radial-gradient(560px 380px at 50% 106%, rgb(107 93 18 / 0.3), transparent 70%),
        radial-gradient(520px 420px at 90% 104%, rgb(251 59 39 / 0.26), transparent 70%);
    }
    #pile-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    #pile-scrim {
      position: absolute;
      left: 0;
      top: 520px;
      width: 1080px;
      height: 760px;
      background: radial-gradient(64% 50% at 50% 50%, rgb(7 7 10 / 0.92), rgb(7 7 10 / 0.6) 55%, rgb(7 7 10 / 0) 100%);
    }
    .pile-title {
      position: absolute;
      left: 60px;
      width: 960px;
      text-align: center;
      font-family: "Archivo";
      font-weight: 900;
      font-stretch: 125%;
      text-transform: uppercase;
      letter-spacing: -0.012em;
      line-height: 0.87;
      color: #f4f2ec;
    }
    .pile-title .w {
      display: inline-block;
    }
    #pile-hook {
      top: 600px;
      font-size: 164px;
    }
    #pile-cut {
      top: 724px;
      font-size: 196px;
    }
    #pile-finish {
      top: 780px;
      font-size: 86px;
      white-space: nowrap;
    }
    .pile-sub {
      position: absolute;
      left: 140px;
      width: 800px;
      top: 1120px;
      padding: 22px 0;
      border-radius: 999px;
      text-align: center;
      background: rgb(7 7 10 / 0.88);
      border: 2px solid rgb(244 242 236 / 0.22);
      font-family: "Archivo";
      font-weight: 800;
      font-stretch: 110%;
      font-size: 54px;
      line-height: 1;
      text-transform: uppercase;
      color: #fddf4b;
      white-space: nowrap;
    }
    .pile-accent {
      color: #fddf4b;
    }
  </style>
  <div id="root" data-composition-id="pile" data-width="1080" data-height="1920">
    <div id="pile-glow"></div>
    <canvas data-layout-ignore id="pile-canvas" width="1080" height="1920"></canvas>
    <div id="pile-scrim"></div>
    <h1 id="pile-hook" class="pile-title clip" data-start="0" data-duration="3.9" data-track-index="3">
      <span class="w" id="pile-hook-1">Your</span><br /><span class="w" id="pile-hook-2">raw</span>
      <span class="w" id="pile-hook-3">pile.</span>
    </h1>
    <div id="pile-sub1" class="pile-sub clip" data-start="0" data-duration="1.40625" data-track-index="5">4 hours of gameplay</div>
    <div id="pile-sub2" class="pile-sub clip" data-start="1.40625" data-duration="1.40625" data-track-index="6">a folder of clips</div>
    <div id="pile-sub3" class="pile-sub clip" data-start="2.8125" data-duration="0.9375" data-track-index="7">a podcast on 3 mics</div>
    <h1 id="pile-cut" class="pile-title clip" data-start="4.6" data-duration="1.05" data-track-index="4">
      <span class="w" id="pile-cut-1">We</span><br /><span class="w" id="pile-cut-2">cut</span>
      <span class="w pile-accent" id="pile-cut-3">it.</span>
    </h1>
    <h1 id="pile-finish" class="pile-title clip" data-start="5.6" data-duration="1.55" data-track-index="8">
      <span class="w" id="pile-fin-1">To the part</span><br /><span class="w pile-accent" id="pile-fin-2">people finish.</span>
    </h1>
  </div>
  <script>
    (function () {
      const W = 1080;
      const H = 1920;
      const canvas = document.getElementById("pile-canvas");
      const ctx = canvas.getContext("2d");

      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(228341325);
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const easeOut = (k) => 1 - Math.pow(1 - k, 3);
      const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
      function hex(h) {
        const n = parseInt(h.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }
      function mix(a, b, k) {
        const x = hex(a);
        const y = hex(b);
        return `rgb(${Math.round(lerp(x[0], y[0], k))},${Math.round(lerp(x[1], y[1], k))},${Math.round(lerp(x[2], y[2], k))})`;
      }

      // Raw (grey, ungraded) and graded colours per thumbnail kind.
      const RAW = {
        sky: "#3d3846", sky2: "#5b5562", ground: "#1d1c23", block: "#2c2a33", hud: "#6c6a74",
        bg: "#24222a", head1: "#8a7f8c", head2: "#6f7a86", ring: "#77757f",
        row1: "#57515e", row2: "#4c564f", row3: "#5c5b67",
      };
      const GRADED = {
        sky: "#1c4cdd", sky2: "#5ae2e8", ground: "#0d1430", block: "#272ed2", hud: "#fddf4b",
        bg: "#1a1020", head1: "#fc8020", head2: "#03c0f4", ring: "#fddf4b",
        row1: "#fb3b27", row2: "#fddf4b", row3: "#03c0f4",
      };

      // Razor passes on the beat (128 BPM): the drop at 3.75 s, then beat 2 of that bar.
      const R1 = 3.75;
      const R2 = 4.6875;
      const RD = 4 / 30;

      // One clip per grid cell, jittered, so the pile spreads across the frame instead of clumping.
      const COLS = 8;
      const ROWS = 13;
      const CW = (W + 120) / COLS;
      const CH = (H + 120) / ROWS;
      const cards = [];
      for (let i = 0; i < COLS * ROWS; i++) {
        const col = i % COLS;
        const row = Math.floor(i / COLS);
        const z = 0.62 + rnd() * 0.42;
        const c = {
          x: -60 + (col + 0.5 + (row % 2) * 0.25) * CW + (rnd() - 0.5) * CW * 0.45,
          y: -60 + (row + 0.5) * CH + (rnd() - 0.5) * CH * 0.45,
          z,
          w: 190 * z,
          h: 107 * z,
          vx: (rnd() - 0.5) * 22,
          vy: (rnd() - 0.5) * 22,
          r0: rnd() * Math.PI * 2,
          vr: (rnd() < 0.5 ? -1 : 1) * (0.05 + rnd() * 0.2),
          f0: rnd() * Math.PI * 2,
          vf: (rnd() < 0.5 ? -1 : 1) * (0.25 + rnd() * 0.7),
          kind: Math.floor(rnd() * 4),
          segs: [0, 1, 2].map(() => [0.05 + rnd() * 0.3, 0.2 + rnd() * 0.45]),
          burnSecond: rnd() < 0.5,
          burnJitter: rnd() * 0.45,
          keeper: false,
          embers: [],
        };
        for (let k = 0; k < 6; k++) {
          c.embers.push({
            dx: (rnd() - 0.5) * c.w * 0.9,
            dy: (rnd() - 0.5) * c.h * 0.8,
            delay: 0.1 + k * 0.05 + rnd() * 0.1,
            life: 0.6 + rnd() * 0.3,
            rise: 120 + rnd() * 140,
            sway: 6 + rnd() * 10,
            phase: rnd() * 6.28,
            size: 1.6 + rnd() * 2.8,
          });
        }
        cards.push(c);
      }
      // 21 keepers, spread through the middle of the frame.
      const candidates = cards.filter((c) => c.x > 120 && c.x < 960 && c.y > 260 && c.y < 1660);
      for (let k = 0; k < 21 && k < candidates.length; k++) {
        candidates[Math.floor((k * candidates.length) / 21)].keeper = true;
      }
      cards.sort((a, b) => a.z - b.z);
      cards.forEach((c) => {
        const cut1 = R1 + RD * clamp(c.x / W);
        const cut2 = R2 + RD * clamp((W - c.x) / W);
        c.cut1 = cut1;
        c.cut2 = cut2;
        c.burn = (c.burnSecond ? cut2 : cut1) + 0.05 + c.burnJitter;
      });

      const stars = [];
      for (let i = 0; i < 90; i++) {
        stars.push({ x: rnd() * W, y: rnd() * H, r: 0.6 + rnd() * 1.1, a: 0.08 + rnd() * 0.22 });
      }

      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function thumb(c, tx, ty, tw, th, g, t) {
        const col = (key) => mix(RAW[key], GRADED[key], g);
        if (c.kind === 0) {
          const grad = ctx.createLinearGradient(0, ty, 0, ty + th);
          grad.addColorStop(0, col("sky"));
          grad.addColorStop(1, col("sky2"));
          ctx.fillStyle = grad;
          ctx.fillRect(tx, ty, tw, th);
          ctx.fillStyle = col("block");
          ctx.fillRect(tx + tw * 0.12, ty + th * 0.38, tw * 0.12, th * 0.3);
          ctx.fillRect(tx + tw * 0.3, ty + th * 0.26, tw * 0.1, th * 0.42);
          ctx.fillRect(tx + tw * 0.7, ty + th * 0.34, tw * 0.14, th * 0.34);
          ctx.fillStyle = col("ground");
          ctx.fillRect(tx, ty + th * 0.66, tw, th * 0.34);
          ctx.fillStyle = col("hud");
          ctx.fillRect(tx + tw * 0.06, ty + th * 0.08, tw * 0.28, th * 0.07);
          ctx.fillRect(tx + tw * 0.49, ty + th * 0.47, tw * 0.02, th * 0.1);
          ctx.fillRect(tx + tw * 0.46, ty + th * 0.51, tw * 0.08, th * 0.02);
        } else if (c.kind === 1) {
          ctx.fillStyle = col("bg");
          ctx.fillRect(tx, ty, tw, th);
          [[0.32, "head1"], [0.68, "head2"]].forEach(([px, key]) => {
            ctx.fillStyle = col(key);
            ctx.beginPath();
            ctx.arc(tx + tw * px, ty + th * 0.42, th * 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(tx + tw * px, ty + th * 1.02, th * 0.34, Math.PI, 0);
            ctx.fill();
          });
        } else if (c.kind === 2) {
          ctx.fillStyle = "#121218";
          ctx.fillRect(tx, ty, tw, th);
          ctx.strokeStyle = col("ring");
          ctx.lineWidth = th * 0.05;
          ctx.beginPath();
          const a = t * 4 + c.f0;
          ctx.arc(tx + tw * 0.5, ty + th * 0.42, th * 0.17, a, a + 4.2);
          ctx.stroke();
          ctx.fillStyle = col("hud");
          ctx.fillRect(tx + tw * 0.34, ty + th * 0.74, tw * 0.32, th * 0.05);
        } else {
          ctx.fillStyle = "#16151c";
          ctx.fillRect(tx, ty, tw, th);
          ["row1", "row2", "row3"].forEach((key, r) => {
            ctx.fillStyle = col(key);
            const [s, l] = c.segs[r];
            ctx.fillRect(tx + tw * s, ty + th * (0.18 + r * 0.26), tw * l, th * 0.16);
            ctx.fillRect(tx + tw * Math.min(0.92, s + l + 0.04), ty + th * (0.18 + r * 0.26), tw * 0.12, th * 0.16);
          });
          ctx.fillStyle = "#f4f2ec";
          ctx.fillRect(tx + tw * 0.56, ty + th * 0.08, tw * 0.012, th * 0.84);
        }
      }

      function face(c, w, h, g, tint, t, back) {
        const z = c.z;
        rr(-w / 2, -h / 2, w, h, 5 * z);
        ctx.fillStyle = back ? "#0f0f15" : "#15151c";
        ctx.fill();
        if (back) {
          ctx.strokeStyle = "#24242e";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        } else {
          const b = 3 * z;
          const strip = 15 * z;
          thumb(c, -w / 2 + b, -h / 2 + b, w - 2 * b, h - 2 * b - strip, g, t);
          ctx.fillStyle = mix("#3a3a44", "#c4c4d0", g);
          ctx.fillRect(-w / 2 + 8 * z, h / 2 - 10 * z, 54 * z, 4 * z);
          ctx.fillStyle = "#2c2c36";
          ctx.fillRect(w / 2 - 30 * z, h / 2 - 10 * z, 22 * z, 4 * z);
        }
        if (tint > 0) {
          rr(-w / 2, -h / 2, w, h, 5 * z);
          ctx.fillStyle = `rgba(251,59,39,${0.78 * tint})`;
          ctx.fill();
        }
      }

      function cardAt(c, t) {
        let cx = c.x + c.vx * t;
        let cy = c.y + c.vy * t;
        let rot = c.r0 + c.vr * t;
        let sx = Math.cos(c.f0 + c.vf * t);
        let s = 1;
        let g = 0;
        if (c.keeper) {
          g = easeOut(clamp((t - c.cut1 - 0.05) / 0.6));
          sx = lerp(sx, 1, g);
          rot = lerp(rot, Math.sin(c.r0) * 0.18, g * 0.85);
          s = lerp(1, 1.12, g);
          const f = clamp((t - 7.03) / 0.47);
          const e = f * f * f;
          cx = lerp(cx, 540, e);
          cy = lerp(cy, 960, e);
          s *= lerp(1, 0.3, e);
          rot = lerp(rot, 0, e);
        }
        return { cx, cy, rot, sx, s, g };
      }

      function drawCard(c, t) {
        const st = cardAt(c, t);
        const w = c.w * st.s;
        const h = c.h * st.s;
        let tint = 0;
        let alpha = 1;
        let sep1 = 0;
        let sep2 = 0;
        if (!c.keeper) {
          sep1 = 9 * c.z * easeOut(clamp((t - c.cut1) / 0.35));
          sep2 = 7 * c.z * easeOut(clamp((t - c.cut2) / 0.35));
          tint = clamp((t - c.burn) / 0.22);
          const d = clamp((t - c.burn - 0.18) / 0.6);
          alpha = 1 - d * d;
          if (alpha <= 0) return;
        }
        const back = st.sx < 0;
        const sx = Math.sign(st.sx || 1) * Math.max(0.08, Math.abs(st.sx));
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(st.cx, st.cy);
        ctx.rotate(st.rot);
        ctx.scale(sx, 1);
        const pieces = [];
        const xs = sep1 > 0 ? [[-w / 2, 0, -1], [0, w / 2, 1]] : [[-w / 2, w / 2, 0]];
        const ys = sep2 > 0 ? [[-h / 2, 0, -1], [0, h / 2, 1]] : [[-h / 2, h / 2, 0]];
        xs.forEach((px) => ys.forEach((py) => pieces.push([px, py])));
        pieces.forEach(([px, py]) => {
          ctx.save();
          ctx.translate(px[2] * sep1, py[2] * sep2);
          ctx.rotate(px[2] * 0.035 * (sep1 / (9 * c.z || 1)) + py[2] * 0.02 * (sep2 / (7 * c.z || 1)));
          ctx.beginPath();
          ctx.rect(px[0], py[0], px[1] - px[0], py[1] - py[0]);
          ctx.clip();
          face(c, w, h, st.g, tint, t, back);
          ctx.restore();
        });
        if (tint > 0) {
          rr(-w / 2 - sep1, -h / 2 - sep2, w + 2 * sep1, h + 2 * sep2, 5 * c.z);
          ctx.strokeStyle = `rgba(252,128,32,${tint * (1 - clamp((t - c.burn - 0.18) / 0.6))})`;
          ctx.lineWidth = 3 * c.z;
          ctx.stroke();
        }
        if (c.keeper && st.g > 0) {
          rr(-w / 2, -h / 2, w, h, 5 * c.z);
          ctx.strokeStyle = `rgba(244,242,236,${0.55 * st.g})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawEmbers(c, t) {
        if (c.keeper) return;
        const st = cardAt(c, t);
        c.embers.forEach((e) => {
          const a = (t - c.burn - e.delay) / e.life;
          if (a <= 0 || a >= 1) return;
          const x = st.cx + e.dx + Math.sin(a * 6 + e.phase) * e.sway;
          const y = st.cy + e.dy - e.rise * (1 - (1 - a) * (1 - a));
          ctx.fillStyle = a < 0.3 ? "#fcf397" : a < 0.6 ? "#fcb51c" : a < 0.8 ? "#fc8020" : "#fb3b27";
          ctx.globalAlpha = (1 - a) * 0.95;
          ctx.beginPath();
          ctx.arc(x, y, e.size * (1 - a * 0.5), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      function razor(x) {
        ctx.fillStyle = "rgba(244,242,236,0.22)";
        ctx.fillRect(x - 14, 0, 28, H);
        ctx.fillStyle = "rgba(244,242,236,0.5)";
        ctx.fillRect(x - 6, 0, 12, H);
        ctx.fillStyle = "#fb3b27";
        ctx.fillRect(x - 3, 0, 6, H);
      }

      function draw(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, W, H);
        stars.forEach((s) => {
          ctx.fillStyle = `rgba(244,242,236,${s.a})`;
          ctx.fillRect(s.x, s.y, s.r, s.r);
        });
        const sinceBeat = t - Math.floor(t / (60 / 128)) * (60 / 128);
        const kick = t >= R1 ? 0.016 * Math.exp(-sinceBeat / 0.1) : 0.006 * Math.exp(-sinceBeat / 0.1);
        const cam = (1 + 0.05 * easeInOut(clamp(t / 3.7))) * (1 + kick);
        ctx.translate(540, 960);
        ctx.scale(cam, cam);
        ctx.translate(-540, -960);
        cards.forEach((c) => {
          if (!c.keeper) drawCard(c, t);
        });
        ctx.globalCompositeOperation = "lighter";
        cards.forEach((c) => drawEmbers(c, t));
        ctx.globalCompositeOperation = "source-over";
        cards.forEach((c) => {
          if (c.keeper) drawCard(c, t);
        });
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        if (t >= R1 && t <= R1 + RD) razor(W * ((t - R1) / RD));
        if (t >= R2 && t <= R2 + RD) razor(W * (1 - (t - R2) / RD));
      }

      const tl = gsap.timeline({ paused: true });
      // Beat punch: a quick scale hit that settles, placed on the beat grid.
      function punch(targets, times, amount, dur) {
        times.forEach((at) => {
          tl.fromTo(targets, { scale: 1 + amount }, { scale: 1, duration: dur || 0.22, ease: "power2.out", immediateRender: false }, at);
        });
      }
      const BEAT = 60 / 128;
      punch(["#pile-hook-1", "#pile-hook-2", "#pile-hook-3"], [1, 2, 3, 4, 5, 6, 7].map((k) => k * BEAT), 0.05);
      punch(["#pile-cut-1", "#pile-cut-2", "#pile-cut-3"], [R2 + BEAT, R2 + 2 * BEAT], 0.07);
      punch(["#pile-fin-1", "#pile-fin-2"], [5.625 + BEAT, 5.625 + 2 * BEAT], 0.05);
      // The hook is on screen at frame 0; the first razor takes it off.
      tl.fromTo(
        ["#pile-hook-1", "#pile-hook-2", "#pile-hook-3"],
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in", stagger: 0.03 },
        R1 - 0.02,
      );
      // "WE CUT IT." lands word by word behind the second razor.
      tl.fromTo(
        ["#pile-cut-1", "#pile-cut-2", "#pile-cut-3"],
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.067 },
        R2 + 0.04,
      );
      tl.to(
        ["#pile-cut-1", "#pile-cut-2", "#pile-cut-3"],
        { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in", stagger: 0.03 },
        5.47,
      );
      // ...down to the part people finish.
      tl.fromTo(
        ["#pile-fin-1", "#pile-fin-2"],
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.12 },
        5.625,
      );
      tl.to(["#pile-fin-1", "#pile-fin-2"], { opacity: 0, filter: "blur(8px)", duration: 0.13, ease: "power3.in" }, 6.95);
      // The hook's subline swaps every three beats.
      ["#pile-sub1", "#pile-sub2", "#pile-sub3"].forEach((id, i) => {
        tl.fromTo(id, { x: 120, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out" }, i * 1.40625);
      });
      tl.fromTo("#pile-scrim", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 7.0);
      // The canvas clock: the pile is drawn from timeline time alone.
      tl.to({}, { duration: 7.5 }, 0);
      tl.eventCallback("onUpdate", () => draw(tl.time()));
      draw(0);
      window.__timelines["pile"] = tl;
    })();
  </script>
</template>
