  <script>
    (function () {
      const B = 60 / 128;
      const P = 3.75;
      const HOURS = [36, 12, 48, 8];
      const tl = gsap.timeline({ paused: true });
      const counters = HOURS.map(() => ({ v: 0 }));
      // Beat punch: a quick scale hit that settles, placed on the beat grid.
      function punch(targets, times, amount, dur) {
        times.forEach((at) => {
          tl.fromTo(targets, { scale: 1 + amount }, { scale: 1, duration: dur || 0.22, ease: "power2.out", immediateRender: false }, at);
        });
      }


      HOURS.forEach((h, k) => {
        const i = k + 1;
        const t0 = k * P;
        // Whip in from the right on the downbeat, whip out to the left just before the next bar.
        tl.fromTo(`#svc-${i}-in`, { x: 1080, filter: "blur(20px)" }, { x: 0, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, t0);
        tl.fromTo(`#svc-${i}-bg`, { x: 160, rotation: -4 }, { x: -120, rotation: 2, duration: P, ease: "none" }, t0);
        punch(`#svc-${i}-name`, [t0 + 4 * B], 0.05);
        punch(`#svc-${i}-num`, [t0 + 4 * B, t0 + 6 * B], 0.12, 0.2);
        tl.fromTo(`#svc-${i}-name`, { y: 0 }, { y: -14, duration: P - 0.3, ease: "power1.inOut" }, t0 + 0.28);
        tl.fromTo(`#svc-${i}-tag`, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, t0 + 0.08);
        tl.fromTo(`#svc-${i}-art`, { scale: 0.86, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "expo.out" }, t0 + B);
        tl.fromTo(`#svc-${i}-back`, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, t0 + 2 * B);
        tl.fromTo(`#svc-${i}-num`, { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "expo.out" }, t0 + 2 * B);
        tl.fromTo(counters[k], { v: 0 }, { v: h, duration: 0.42, ease: "power2.out" }, t0 + 2 * B);
        tl.fromTo(
          [`#svc-${i}-d1`, `#svc-${i}-d2`, `#svc-${i}-d3`],
          { opacity: 0, filter: "blur(6px)", x: 30 },
          { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.15, ease: "power4.out", stagger: 0.08 },
          t0 + 3 * B,
        );
        if (k < 3) {
          tl.to(`#svc-${i}-in`, { x: -1080, filter: "blur(18px)", duration: 0.22, ease: "power3.in" }, t0 + P - 0.22);
        } else {
          tl.to(`#svc-${i}-in`, { y: -1920, filter: "blur(18px)", duration: 0.22, ease: "power3.in" }, t0 + P - 0.22);
        }
      });

      // 01: the retention graph draws across the level and holds high.
      const line = document.getElementById("svc-ret-line");
      const len = 900;
      line.setAttribute("stroke-dasharray", String(len));
      tl.fromTo(line, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.6, ease: "power1.inOut" }, B * 1.5);
      tl.fromTo("#svc-ret-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.18, ease: "expo.out" }, B * 4);

      // 02: seven verticals pop in on the 16ths, Monday to Sunday.
      for (let d = 1; d <= 7; d++) {
        tl.fromTo(`#svc-ph${d}`, { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "expo.out" }, P + B * 1.2 + (d - 1) * (B / 4));
      }
      tl.fromTo("#svc-week", { x: 0 }, { x: -18, duration: 2.6, ease: "power1.inOut" }, P + B);

      // 03: the cut switches camera on every beat; the levels keep moving.
      [1, 2, 3, 1, 2, 3].forEach((cam, n) => {
        tl.to(`#svc-cam${cam}`, { borderColor: "#fddf4b", duration: 0.05, ease: "none" }, 2 * P + B * (1 + n));
        tl.to(`#svc-cam${cam}`, { borderColor: "rgba(244,242,236,0.2)", duration: 0.05, ease: "none" }, 2 * P + B * (2 + n) - 0.05);
      });
      for (let w = 1; w <= 14; w++) {
        const lo = 0.2 + 0.12 * ((w * 5) % 4);
        const hi = 0.55 + 0.45 * Math.abs(Math.sin(w * 1.9));
        tl.fromTo(`#svc-pw${w}`, { scaleY: lo }, { scaleY: hi, duration: B / 2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 2 * P + B);
      }

      // 04: three concepts land, then one is picked as the final art.
      [1, 2, 3].forEach((n) => {
        tl.fromTo(`#svc-th${n}`, { y: 60, opacity: 0, rotation: -4 + n * 2 }, { y: 0, opacity: 1, rotation: 0, duration: 0.2, ease: "expo.out" }, 3 * P + B * (1 + (n - 1) * 0.5));
      });
      tl.to(["#svc-th1", "#svc-th3"], { opacity: 0.35, scale: 0.94, duration: 0.2, ease: "power2.out" }, 3 * P + B * 4);
      tl.to("#svc-th2", { scale: 1.12, borderColor: "#f4f2ec", duration: 0.24, ease: "expo.out" }, 3 * P + B * 4);

      function paint() {
        HOURS.forEach((h, k) => {
          document.getElementById(`svc-${k + 1}-num`).textContent = `${Math.round(counters[k].v)}H`;
        });
      }
      tl.eventCallback("onUpdate", paint);
      paint();
      window.__timelines["services"] = tl;
    })();
  </script>
