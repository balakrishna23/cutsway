  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const T2 = 1.2;
      const T3 = 2.4;
      const COLLAPSE = 3.7;

      // 01 grows out of the centre, where the keepers just flew in.
      tl.fromTo(
        "#keep-1-in",
        { scale: 0.42, y: 515, filter: "blur(14px)" },
        { scale: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        0,
      );
      // 02 whips in from the right, 03 from the left.
      tl.fromTo(
        "#keep-2-in",
        { x: 1150, filter: "blur(18px)" },
        { x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" },
        T2,
      );
      tl.fromTo(
        "#keep-3-in",
        { x: -1150, filter: "blur(18px)" },
        { x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" },
        T3,
      );
      [
        ["#keep-1", 0.12],
        ["#keep-2", T2 + 0.1],
        ["#keep-3", T3 + 0.1],
      ].forEach(([id, at]) => {
        tl.fromTo(
          `${id}-word`,
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" },
          at,
        );
        tl.fromTo(`${id}-num`, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, at + 0.06);
      });

      // Inside each card, the work keeps running.
      tl.fromTo("#keep-hp-fill", { scaleX: 0.25 }, { scaleX: 0.9, duration: 3.5, ease: "power1.inOut" }, 0.2);
      tl.fromTo("#keep-cross", { x: 0, y: 0 }, { x: -120, y: 30, duration: 3.5, ease: "power2.inOut" }, 0.2);
      ["#keep-feed-a", "#keep-feed-b", "#keep-feed-c"].forEach((id, i) => {
        tl.fromTo(id, { yPercent: -10 * i }, { yPercent: -45 - 10 * i, duration: 2.6, ease: "none" }, T2);
      });
      for (let i = 1; i <= 10; i++) {
        const lo = 0.18 + 0.1 * ((i * 7) % 4);
        const hi = 0.55 + 0.45 * Math.abs(Math.sin(i * 1.7));
        tl.fromTo(
          `#keep-w${i}`,
          { scaleY: lo },
          { scaleY: hi, duration: 0.18 + 0.03 * (i % 3), ease: "sine.inOut", yoyo: true, repeat: 5 },
          T3 + 0.1,
        );
      }

      // The three keepers collapse into one bar at y 1010: the turnaround bar.
      [
        ["#keep-1", 565],
        ["#keep-2", 225],
        ["#keep-3", -115],
      ].forEach(([id, dy], i) => {
        tl.to(`${id}-word, ${id}-num`, { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power3.in" }, COLLAPSE + i * 0.04);
        tl.to(`${id}-bar`, { opacity: 1, duration: 0.2, ease: "power2.in" }, COLLAPSE + 0.1);
        tl.to(`${id}-in .keep-art, ${id}-in .keep-shade`, { opacity: 0, duration: 0.3, ease: "power2.in" }, COLLAPSE + 0.08);
        tl.to(
          `${id}-in`,
          {
            y: dy,
            scaleY: 20 / 290,
            borderColor: "rgba(244,242,236,0)",
            backgroundColor: "rgba(17,17,24,0)",
            duration: 0.55,
            ease: "power3.inOut",
          },
          COLLAPSE + i * 0.03,
        );
      });

      window.__timelines["keepers"] = tl;
    })();
  </script>
