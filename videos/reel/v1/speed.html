  <div data-hf-id="hf-pl0a" id="root" data-composition-id="speed" data-width="1080" data-height="1920">
    <div data-hf-id="hf-402s" id="speed-glow"></div>
    <h2 data-hf-id="hf-g9yu" id="speed-top" class="speed-line clip" data-start="0" data-duration="2.3" data-track-index="1">
      <span data-hf-id="hf-bebr" class="w" id="speed-w1">Shorts</span> <span data-hf-id="hf-tgt4" class="w" id="speed-w2">back</span>

    </h2>

    <div data-hf-id="hf-tgv3" id="speed-timer" class="clip" data-start="0" data-duration="2.3" data-track-index="5">00:00</div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const timer = document.getElementById("speed-timer");
      const clock = { h: 0 };

      tl.fromTo(
        ["#speed-w1", "#speed-w2", "#speed-w3"],
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.067 },
        0.05,
      );
      tl.fromTo(
        ["#speed-w4", "#speed-w5"],
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", stagger: 0.08 },
        0.3,
      );
      tl.fromTo(["#speed-from", "#speed-timer"], { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.2);

      // The bar fills like an export while the clock runs to 12 hours.
      tl.fromTo("#speed-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power2.inOut" }, 0.3);
      tl.fromTo(clock, { h: 0 }, { h: 12, duration: 1.4, ease: "power2.inOut" }, 0.3);

      tl.to(
        ["#speed-w1", "#speed-w2", "#speed-w3", "#speed-w4", "#speed-w5", "#speed-from", "#speed-timer"],
        { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in", stagger: 0.02 },
        2.02,
      );

      function paint() {
        const minutes = Math.round(clock.h * 60);
        const hh = String(Math.floor(minutes / 60)).padStart(2, "0");
        const mm = String(minutes % 60).padStart(2, "0");
        timer.textContent = `${hh}:${mm}`;
      }
      tl.eventCallback("onUpdate", paint);
      paint();
      window.__timelines["speed"] = tl;
    })();
  </script>
